<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>AI → Python → Image</title>
    <link rel="stylesheet" href="/static/styles.css"/>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
<main class="page">
    <section class="chat-container">
        <div class="chat-header">
            <h1 class="title">AI → Python → Image</h1>
            <p class="hint">Опишите идею, и ИИ сгенерирует код для создания графика.</p>
        </div>
        <div id="messages" class="messages"></div>
        <div class="composer-container">
            <div class="composer">
                <textarea id="prompt" rows="1" placeholder="Например: нарисуй график функции y = x^2"></textarea>
                <button id="send" title="Отправить">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 11L12 6L17 11"></path>
                        <path d="M12 18V6"></path>
                    </svg>
                </button>
            </div>
        </div>
    </section>
</main>

<template id="tpl-user">
    <div class="msg user">
        <div class="bubble">
            <div class="bubble-body"></div>
        </div>
    </div>
</template>

<template id="tpl-bot">
    <div class="msg bot">
        <div class="bubble">
            <div class="bubble-body">
                <div class="output-container">
                    <div class="output-header">
                        <span class="output-title">Результат</span>
                        <button class="toggle-code">Показать код</button>
                    </div>
                    <div class="output-content">
                        <div class="term-output"></div>
                        <div class="term-images"></div>
                        <div class="code-wrapper hidden">
                            <pre><code class="language-python"></code></pre>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>

<div id="spinner" class="spinner hidden"></div>

<script>
    const messages = document.getElementById('messages')
    const tplUser = document.getElementById('tpl-user')
    const tplBot = document.getElementById('tpl-bot')
    const promptEl = document.getElementById('prompt')
    const btnSend = document.getElementById('send')
    const spinner = document.getElementById('spinner')

    function showSpinner(v) {
        spinner.classList.toggle('hidden', !v)
    }

    function scrollBottom() {
        messages.scrollTop = messages.scrollHeight
    }

    function addUser(text) {
        const node = tplUser.content.cloneNode(true)
        node.querySelector('.bubble-body').textContent = text
        messages.appendChild(node)
        scrollBottom()
    }

    function addBot() {
        const node = tplBot.content.cloneNode(true)
        messages.appendChild(node)
        scrollBottom()
        const root = messages.lastElementChild
        const out = root.querySelector('.term-output')
        const imgs = root.querySelector('.term-images')
        const codeWrapper = root.querySelector('.code-wrapper')
        const code = root.querySelector('code')
        const toggle = root.querySelector('.toggle-code')
        toggle.addEventListener('click', () => {
            const isHidden = codeWrapper.classList.toggle('hidden')
            toggle.textContent = isHidden ? 'Показать код' : 'Скрыть код'
        })
        return {root, out, imgs, code, codeWrapper}
    }

    async function fetchText(url) {
        const r = await fetch(url)
        return await r.text()
    }

    function renderTerminal(outEl, imgsEl, stdoutText, stderrText, imageUrls) {
        const s = (stdoutText || '').trim()
        const e = (stderrText || '').trim()

        if (s) {
            const std = document.createElement('pre')
            std.className = 'mono'
            std.textContent = s
            outEl.appendChild(std)
        }
        if (e) {
            const err = document.createElement('pre')
            err.className = 'mono error'
            err.textContent = e
            outEl.appendChild(err)
        }

        if (!imageUrls || !imageUrls.length) {
            const placeholder = document.createElement('div')
            placeholder.className = 'placeholder'
            placeholder.textContent = 'Изображение не было сгенерировано'
            imgsEl.appendChild(placeholder)
        } else {
            imageUrls.forEach(u => {
                const a = document.createElement('a')
                a.href = u
                a.target = '_blank'
                const img = document.createElement('img')
                img.src = u
                a.appendChild(img)
                imgsEl.appendChild(a)
            })
        }
    }

    async function handleSend() {
        const text = promptEl.value.trim()
        if (!text) return
        addUser(text)
        promptEl.value = ''
        promptEl.style.height = 'auto';
        const bot = addBot()
        showSpinner(true)
        try {
            const res = await fetch('/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({prompt: text})
            })
            const data = await res.json()
            if (!res.ok) {
                bot.out.innerHTML = `<pre class="mono error">Ошибка: ${data.error || 'Неизвестная ошибка сервера'}</pre>`
                showSpinner(false)
                return
            }
            const codeText = await fetchText(data.code_url)
            const stdoutText = await fetchText(data.stdout_url)
            const stderrText = await fetchText(data.stderr_url)
            bot.code.textContent = codeText
            hljs.highlightElement(bot.code);
            renderTerminal(bot.out, bot.imgs, stdoutText, stderrText, data.image_urls)
        } catch (e) {
            bot.out.innerHTML = '<pre class="mono error">Сетевая ошибка. Не удалось выполнить запрос.</pre>'
        }
        showSpinner(false)
        scrollBottom()
    }

    btnSend.addEventListener('click', handleSend)
    promptEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    });
    promptEl.addEventListener('input', () => {
        promptEl.style.height = 'auto';
        promptEl.style.height = (promptEl.scrollHeight) + 'px';
    });
</script>
</body>
</html>
